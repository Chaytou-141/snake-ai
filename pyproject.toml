[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-ai"
version = "1.0.0"
description = "SnakeAI: reproducible DQN experiments, diagnostics and local demonstration"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ml = ["torch==2.15.0"]
training = ["torch==2.15.0", "matplotlib==3.11.2"]

[project.scripts]
snake-ai = "snake_ai.__main__:main"
snake-ai-demo = "snake_ai.demo:main"
snake-ai-dashboard = "snake_ai.dashboard:main"

[tool.setuptools.packages.find]
include = ["snake_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
